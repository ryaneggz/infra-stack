name: ${COMPOSE_PROJECT_NAME:-infra-stack}

services:
  postgres:
    image: ${POSTGRES_IMAGE:-timescale/timescaledb-ha:pg17.6-ts2.21.3-all}
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-infra}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/home/postgres/pgdata/data
      - type: bind
        source: ./scripts/postgres/init.sql
        target: /docker-entrypoint-initdb.d/010-extensions.sql
        read_only: true
        bind:
          create_host_path: false
    networks: [infra]
    cpus: ${POSTGRES_CPUS:-1.50}
    mem_limit: ${POSTGRES_MEMORY:-2g}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB} && psql -U $${POSTGRES_USER} -d $${POSTGRES_DB} -Atqc \"SELECT count(*) = 2 FROM pg_extension WHERE extname IN ('vector','vectorscale')\" | grep -qx t"]
      interval: 10s
      timeout: 5s
      retries: 18
      start_period: 30s

  redis:
    image: ${REDIS_IMAGE:-redis:7.4.7-alpine}
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes", "--requirepass", "${REDIS_PASSWORD}"]
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    networks: [infra]
    cpus: ${REDIS_CPUS:-0.50}
    mem_limit: ${REDIS_MEMORY:-512m}
    healthcheck:
      test: ["CMD-SHELL", "redis-cli --no-auth-warning -a \"$${REDIS_PASSWORD}\" ping | grep -qx PONG"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 5s
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  minio:
    image: ${MINIO_IMAGE:-minio/minio:RELEASE.2025-09-07T16-13-09Z}
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-infraadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MINIO_PORT:-9000}:9000"
      - "${BIND_HOST:-127.0.0.1}:${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - type: bind
        source: ${MINIO_DATA_DIR:-./data/minio}
        target: /data
        bind:
          create_host_path: false
    networks: [infra]
    cpus: ${MINIO_CPUS:-0.75}
    mem_limit: ${MINIO_MEMORY:-1g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 10s

  mongo:
    image: ${MONGO_IMAGE:-mongo:8.0.28-noble}
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_ROOT_USERNAME:-infra}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_ROOT_PASSWORD}
      MONGO_INITDB_DATABASE: ${MONGO_INITDB_DATABASE:-app}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MONGO_PORT:-27017}:27017"
    volumes:
      - mongo_data:/data/db
    networks: [infra]
    cpus: ${MONGO_CPUS:-1.00}
    mem_limit: ${MONGO_MEMORY:-1536m}
    healthcheck:
      test: ["CMD-SHELL", "mongosh --quiet --username \"$${MONGO_INITDB_ROOT_USERNAME}\" --password \"$${MONGO_INITDB_ROOT_PASSWORD}\" --authenticationDatabase admin --eval 'quit(db.adminCommand({ ping: 1 }).ok ? 0 : 2)'"]
      interval: 10s
      timeout: 7s
      retries: 18
      start_period: 20s

  s3cli:
    image: ${AWS_CLI_IMAGE:-amazon/aws-cli:2.36.20}
    profiles: [tools]
    depends_on:
      minio:
        condition: service_healthy
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:-infraadmin}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_DEFAULT_REGION: us-east-1
      AWS_EC2_METADATA_DISABLED: "true"
      AWS_PAGER: ""
      S3_ENDPOINT: http://minio:9000
      POSTGRES_BACKUP_BUCKET: ${POSTGRES_BACKUP_BUCKET:-postgres-backups}
      S3_UPLOAD_PRE_PUT_DELAY: ${S3_UPLOAD_PRE_PUT_DELAY:-0}
      S3_UPLOAD_TEST_READY_FILE: ${S3_UPLOAD_TEST_READY_FILE:-}
    entrypoint: ["/bin/sh"]
    volumes:
      - type: bind
        source: ${POSTGRES_BACKUP_DIR:-./backups/postgres}
        target: /backups/postgres
        bind:
          create_host_path: false
      - type: bind
        source: ./scripts/s3cli
        target: /scripts/s3cli
        read_only: true
        bind:
          create_host_path: false
    networks: [infra]

volumes:
  postgres_data:
  redis_data:
  mongo_data:

networks:
  infra:
    name: ${INFRA_NETWORK:-infra}
    external: true
