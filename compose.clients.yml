services:
  cloudbeaver:
    image: ${CLOUDBEAVER_IMAGE:-dbeaver/cloudbeaver:25.1.5}
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${CLOUDBEAVER_PORT:-8978}:8978"
    volumes:
      - cloudbeaver_data:/opt/cloudbeaver/workspace
    networks: [infra]
    mem_limit: 512m
    cpus: 0.50

  pgadmin:
    image: ${PGADMIN_IMAGE:-dpage/pgadmin4:9.5}
    profiles: [pgadmin]
    restart: unless-stopped
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_DEFAULT_EMAIL:-admin@example.invalid}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_DEFAULT_PASSWORD}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    networks: [infra]
    mem_limit: 384m
    cpus: 0.50

  redisinsight:
    image: ${REDISINSIGHT_IMAGE:-redis/redisinsight:2.70}
    restart: unless-stopped
    ports:
      - "${BIND_HOST:-127.0.0.1}:${REDISINSIGHT_PORT:-5540}:5540"
    volumes:
      - redisinsight_data:/data
    networks: [infra]
    mem_limit: 512m
    cpus: 0.50

  mongo-express:
    image: ${MONGO_EXPRESS_IMAGE:-mongo-express:1.0.2-20-alpine3.19}
    restart: unless-stopped
    environment:
      ME_CONFIG_MONGODB_URL: mongodb://${MONGO_ROOT_USERNAME:-infra}:${MONGO_ROOT_PASSWORD}@mongo:27017/?authSource=admin
      ME_CONFIG_BASICAUTH_ENABLED: "true"
      ME_CONFIG_BASICAUTH_USERNAME: ${MONGO_EXPRESS_BASICAUTH_USERNAME:-admin}
      ME_CONFIG_BASICAUTH_PASSWORD: ${MONGO_EXPRESS_BASICAUTH_PASSWORD}
    ports:
      - "${BIND_HOST:-127.0.0.1}:${MONGO_EXPRESS_PORT:-8081}:8081"
    networks: [infra]
    mem_limit: 256m
    cpus: 0.25

volumes:
  cloudbeaver_data:
  pgadmin_data:
  redisinsight_data:
